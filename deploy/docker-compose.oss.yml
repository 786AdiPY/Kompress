# ─────────────────────────────────────────────────────────────────────────────
#  Kompress — full open-source stack (no managed cloud service required).
#
#  Wires: PostgreSQL (MLflow backend) · MinIO (S3-compatible artifacts + uploads) ·
#  Valkey (queue) · MLflow (tracking + registry) · Kompress API · Kompress workers ·
#  Dashboard (nginx). Every arrow that would be an AWS/GCP service is an OSS container.
#
#  Run from the repo root:
#     docker compose -f deploy/docker-compose.oss.yml up --build
#
#  Then: Dashboard http://localhost:8080 · API http://localhost:8000/docs
#        MLflow http://localhost:5000 · MinIO console http://localhost:9001
#
#  Credentials below are DEV DEFAULTS — change them for anything real.
# ─────────────────────────────────────────────────────────────────────────────
name: kompress

x-platform-env: &platform-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT: self-serve-compression
  PROJECT: compression
  KOMPRESS_EXECUTION: queue
  KOMPRESS_QUEUE: redis://valkey:6379/0
  API_RUNS_DIR: /shared/api_runs
  API_ALLOW_LOCAL_PATHS: "0"          # production: pointers only, no local paths
  CORS_ORIGINS: "*"
  # object storage (MinIO in-cluster; drop S3_ENDPOINT_URL to use real AWS S3)
  S3_ENDPOINT_URL: http://minio:9000
  KOMPRESS_BUCKET: kompress
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000

volumes:
  pgdata:
  miniodata:
  shared:        # api + workers share run dirs (a PVC in K8s)

services:
  # ── PostgreSQL: MLflow metadata store (concurrent-writer safe) ──────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── MinIO: S3-compatible object storage (model/data uploads + MLflow artifacts)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── one-shot: create the bucket MLflow + uploads use ────────────────────────
  createbuckets:
    image: minio/mc
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set m http://minio:9000 minioadmin minioadmin &&
             mc mb -p m/kompress && echo 'bucket ready'"

  # ── Valkey: the job queue (OSS Redis fork) ──────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── MLflow: tracking server + model registry (Postgres + MinIO artifacts) ───
  mlflow:
    build: {context: .., dockerfile: deploy/Dockerfile.mlflow}
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres/mlflow
      --default-artifact-root s3://kompress/mlflow
      --host 0.0.0.0 --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      createbuckets: {condition: service_completed_successfully}

  # ── Kompress API (Front Door B): enqueues jobs, serves the dashboard's API ──
  api:
    build: {context: .., dockerfile: deploy/Dockerfile.platform}
    environment: *platform-env
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    volumes: [shared:/shared]
    ports: ["8000:8000"]
    depends_on:
      valkey: {condition: service_healthy}
      minio: {condition: service_healthy}
      mlflow: {condition: service_started}

  # ── Kompress workers: pull jobs, compress in isolation, store in MLflow ─────
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile.platform}
    environment: *platform-env
    command: python -m worker.worker --poll 2
    volumes: [shared:/shared]
    depends_on:
      api: {condition: service_started}
    deploy:
      replicas: 2        # scale out: docker compose ... up --scale worker=N

  # ── Dashboard (Front Door B UI): nginx serving the SPA + proxying /api ──────
  web:
    build: {context: .., dockerfile: web/Dockerfile}
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_started}
