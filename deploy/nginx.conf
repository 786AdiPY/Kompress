# Serves the dashboard SPA and proxies /api -> the Kompress API service.
# The frontend client uses base URL '/api' (see web/src/api/client.ts), so the
# trailing slash on proxy_pass strips '/api' before forwarding to the API.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;   # allow model/dataset uploads via POST /api/uploads
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # SPA client-side routing
    }
}
