# Serves the dashboard SPA and proxies /api -> the Kompress API service.
# The frontend client uses base URL '/api' (see web/src/api/client.ts), so the
# trailing slash on proxy_pass strips '/api' before forwarding to the API.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Direct-upload ceiling is 10GB (common/limits.py MAX_UPLOAD_BYTES) — sized
        # with headroom above that so the API's own 413 response (not nginx's) is
        # what a slightly-over-limit upload actually sees.
        client_max_body_size 11g;
        # A multi-GB upload over a modest link can take minutes; give it room on
        # both legs (client -> nginx, and nginx -> the API while it streams to
        # object storage) instead of the ~60s defaults.
        client_body_timeout   1800s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # SPA client-side routing
    }
}
