[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kompress"
version = "0.1.0"
description = "A model-compression platform — compress any ML or deep learning model for hardware targets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kompress Team"}]

dependencies = [
    "scikit-learn>=1.4.2",
    "pandas>=2.0.0",
    "numpy>=1.26.4",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "mlflow>=2.13.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.16.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "supabase>=2.9.0",
    "huggingface_hub>=0.23.0",
    "xgboost>=2.0.3",
]

[project.scripts]
kompress-job = "kompress.services.plugin.run_job:main"
kompress-api = "kompress.services.cloud.api.app:main"
kompress-worker = "kompress.services.cloud.worker.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
